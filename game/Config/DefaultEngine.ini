; Mobile-first defaults from the GDD (section 4): mobile forward renderer,
; baked lighting, scalable graphics, Android arm64 + Vulkan, landscape.

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Mobile
AppliedTargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Scalable
AppliedDefaultGraphicsPerformance=Scalable

[/Script/EngineSettings.GameMapsSettings]
; The prototype builds the whole arena at runtime, so the engine's empty map is enough.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/VolleyballCareer26.VC26GameMode

[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.AllowStaticLighting=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.vc26.volleyballcareer26
ApplicationDisplayName=Volleyball Career 26
bBuildForArm64=True
bSupportsVulkan=True
bFullScreen=True
Orientation=SensorLandscape
bPackageDataInsideApk=True

[/Script/Engine.InputSettings]
; The HUD draws its own phone controls.
DefaultTouchInterface=None
