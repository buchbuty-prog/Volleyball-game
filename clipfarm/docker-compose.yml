# Runs everything locally: web app, background worker, Postgres, Redis, MinIO (S3).
# Usage: cp .env.example .env, fill in the keys, then `docker compose up --build`.
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clipfarm:${POSTGRES_PASSWORD:-clipfarm}@postgres:5432/clipfarm
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clipfarm:${POSTGRES_PASSWORD:-clipfarm}@postgres:5432/clipfarm
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clipfarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipfarm}
      POSTGRES_DB: clipfarm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipfarm"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    volumes: [redisdata:/data]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9001:9001"]   # MinIO web console
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-clipfarm}
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 1; done &&
             mc mb --ignore-existing local/$$S3_BUCKET &&
             mc anonymous set none local/$$S3_BUCKET"

volumes:
  pgdata:
  redisdata:
  miniodata:
